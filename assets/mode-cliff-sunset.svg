  <linearGradient id="haze" x2="0" y2="1"><stop stop-color="#ffba7d" stop-opacity=".03"/><stop offset="1" stop-color="#ff9b67" stop-opacity=".5"/></linearGradient>
  <linearGradient id="cliff" x2=".18" y2="1"><stop stop-color="#333b40"/><stop offset=".45" stop-color="#18252b"/><stop offset="1" stop-color="#080f17"/></linearGradient>
  <linearGradient id="lake" x2="0" y2="1"><stop stop-color="#ffab78" stop-opacity=".68"/><stop offset=".16" stop-color="#66808b" stop-opacity=".8"/><stop offset="1" stop-color="#182a3a"/></linearGradient>
  <radialGradient id="sunGlow"><stop stop-color="#ffe5ae" stop-opacity=".95"/><stop offset=".23" stop-color="#ffad72" stop-opacity=".58"/><stop offset="1" stop-color="#f07d68" stop-opacity="0"/></radialGradient>
